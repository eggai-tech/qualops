name: Tag and Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., 0.2.0). Must match package.json.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version matches package.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Version mismatch: input=$VERSION, package.json=$PACKAGE_VERSION"
            echo "::error::Make sure the release PR was merged before tagging."
            exit 1
          fi

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v$VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git "$TAG"

          echo "Created and pushed tag: $TAG"
          echo "The 'Publish to npm' workflow will now build, publish to npm, and create the GitHub release."

name: Publish to npm

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.3 or 0.2.3-beta.1)'
        required: true

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      prerelease: ${{ steps.version.outputs.PRERELEASE }}
      changelog: ${{ steps.changelog.outputs.CONTENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION=${HEAD_REF#release/v}
          fi
          # Validate the same allow-list as create-release-pr.yml. A hand-
          # created release branch with an unrecognised prerelease label
          # (e.g., `release/v0.3.0-preview.1`) would otherwise be classified
          # as stable and clobber npm's `latest` dist-tag.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|alpha|beta)\.[0-9]+)?$'; then
            echo "::error::Version '$VERSION' is not a permitted format. Allowed: X.Y.Z, X.Y.Z-rc.N, X.Y.Z-alpha.N, X.Y.Z-beta.N."
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if echo "$VERSION" | grep -qE '\-(rc|alpha|beta)\.[0-9]+$'; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
          echo "Version: $VERSION"

      - name: Validate version matches package.json
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Version mismatch: input=$VERSION, package.json=$PACKAGE_VERSION"
            exit 1
          fi

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PRERELEASE: ${{ steps.version.outputs.PRERELEASE }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "CONTENT=Pre-release version $VERSION" >> $GITHUB_OUTPUT
          else
            CONTENT=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | tail -n +2 | head -n -1)
            DELIMITER=$(openssl rand -hex 8)
            echo "CONTENT<<${DELIMITER}" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "${DELIMITER}" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create tarball
        run: npm pack

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: '*.tgz'
          retention-days: 7

  create-tag:
    needs: [prepare, build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Create and push tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG="v$VERSION"
          git fetch origin "+refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          fi

  publish-npm:
    needs: [prepare, build-and-test, create-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@eggai/qualops

    steps:
      - name: Check if already published
        id: check
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://registry.npmjs.org/@eggai%2fqualops/$VERSION)
          echo "exists=$([ "$STATUS" = "200" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.check.outputs.exists == 'false'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ""

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance
          fi

      - name: Verify publish
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Waiting for npm to index the package..."
          sleep 10
          npm view @eggai/qualops@$VERSION version
          echo "Successfully published @eggai/qualops@$VERSION"

      - name: Move beta ref forward if stable is newer
        if: steps.check.outputs.exists == 'false' && needs.prepare.outputs.prerelease == 'false'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # --- resolve current beta from git (single source of truth) ---
          git fetch origin "+refs/tags/beta:refs/tags/beta" 2>/dev/null || true
          OLD_BETA_SHA=$(git rev-parse --verify "refs/tags/beta^{}" 2>/dev/null \
                         || git rev-parse --verify "refs/tags/beta" 2>/dev/null \
                         || echo "")
          # Derive beta's version from the vX.Y.Z tag on the beta commit.
          # Release flow always tags vX.Y.Z alongside moving beta, so this holds.
          if [ -n "$OLD_BETA_SHA" ]; then
            BETA_VER=$(git tag --points-at "$OLD_BETA_SHA" \
                       | grep -E '^v[0-9]' | sed 's/^v//' \
                       | sort -V | tail -n1)
          else
            BETA_VER=""
          fi
          # --- version guard ---
          if [ -z "$BETA_VER" ]; then
            echo "No beta git tag found; moving beta to stable."
          else
            SHOULD_MOVE=$(BETA_VER="$BETA_VER" node -e '
              function cmp(a, b) {
                const pa = a.replace(/-.*/, "").split(".").map(Number);
                const pb = b.replace(/-.*/, "").split(".").map(Number);
                for (let i = 0; i < 3; i++) {
                  if (pa[i] !== pb[i]) return pa[i] - pb[i];
                }
                const aHasPre = a.includes("-"), bHasPre = b.includes("-");
                if (!aHasPre && bHasPre) return 1;
                if (aHasPre && !bHasPre) return -1;
                return a < b ? -1 : a > b ? 1 : 0;
              }
              process.stdout.write(cmp(process.env.VERSION, process.env.BETA_VER) >= 0 ? "yes" : "no");
            ')
            if [ "$SHOULD_MOVE" != "yes" ]; then
              echo "Beta ($BETA_VER) is ahead of new stable ($VERSION); leaving beta unchanged."
              exit 0
            fi
            echo "New stable ($VERSION) >= current beta ($BETA_VER); moving beta forward."
          fi
          # --- npm dist-tag ---
          npm dist-tag add "@eggai/qualops@$VERSION" beta
          echo "npm dist-tag beta → $VERSION"
          # --- git tag ---
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARGET_SHA=$(git rev-list -n 1 "v$VERSION")
          git tag -f beta "$TARGET_SHA"
          if [ -n "$OLD_BETA_SHA" ]; then
            git push origin "refs/tags/beta" --force-with-lease="refs/tags/beta:$OLD_BETA_SHA"
          else
            git push origin "refs/tags/beta"
          fi
          echo "git tag beta → $TARGET_SHA (v$VERSION)"

  github-release:
    needs: [prepare, build-and-test, create-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CHANGELOG_BODY: ${{ needs.prepare.outputs.changelog }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, uploading artifacts."
            gh release upload "v$VERSION" *.tgz --clobber
          else
            PRERELEASE_FLAG=""
            INSTALL_TAG=""
            if [ "$PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
              INSTALL_TAG="@beta"
            fi
            printf '%s\n' "## What's Changed" "" "$CHANGELOG_BODY" "" "## Installation" "" '```bash' "npm install @eggai/qualops$INSTALL_TAG" '```' "" "Or as a GitHub Action:" "" '```yaml' "- uses: eggai-tech/qualops@$([ "$PRERELEASE" = "true" ] && echo beta || echo stable)" '```' > /tmp/notes.md
            gh release create "v$VERSION" *.tgz \
              --title "v$VERSION" \
              --notes-file /tmp/notes.md \
              $PRERELEASE_FLAG
          fi

  update-beta-ref:
    needs: [prepare, publish-npm, github-release]
    if: needs.prepare.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Force-move beta tag to release commit
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          TARGET_SHA=$(git rev-list -n 1 "v$VERSION")
          # Capture the current remote `beta` tag SHA (if any) so we can use
          # an explicit lease when pushing. `--force-with-lease` without a
          # value relies on a remote-tracking ref that doesn't exist for tags,
          # so the push is rejected as stale after the first move.
          git fetch origin "+refs/tags/beta:refs/tags/beta" 2>/dev/null || true
          OLD_SHA=$(git rev-parse --verify "refs/tags/beta^{}" 2>/dev/null \
                    || git rev-parse --verify "refs/tags/beta" 2>/dev/null \
                    || echo "")
          echo "Moving beta tag from ${OLD_SHA:-<absent>} to $TARGET_SHA (v$VERSION)"
          git tag -f beta "$TARGET_SHA"
          if [ -n "$OLD_SHA" ]; then
            git push origin "refs/tags/beta" --force-with-lease="refs/tags/beta:$OLD_SHA"
          else
            git push origin "refs/tags/beta"
          fi

  update-stable-ref:
    needs: [prepare, publish-npm, github-release]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Force-move stable tag to release commit
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          TARGET_SHA=$(git rev-list -n 1 "v$VERSION")
          # Capture the current remote `stable` tag SHA (if any) so we can
          # use an explicit lease when pushing. `--force-with-lease` without
          # a value relies on a remote-tracking ref that doesn't exist for
          # tags, so the push is rejected as stale after the first move.
          git fetch origin "+refs/tags/stable:refs/tags/stable" 2>/dev/null || true
          OLD_SHA=$(git rev-parse --verify "refs/tags/stable^{}" 2>/dev/null \
                    || git rev-parse --verify "refs/tags/stable" 2>/dev/null \
                    || echo "")
          echo "Moving stable tag from ${OLD_SHA:-<absent>} to $TARGET_SHA (v$VERSION)"
          git tag -f stable "$TARGET_SHA"
          if [ -n "$OLD_SHA" ]; then
            git push origin "refs/tags/stable" --force-with-lease="refs/tags/stable:$OLD_SHA"
          else
            git push origin "refs/tags/stable"
          fi

      - name: Mark GitHub Release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "v$VERSION" --prerelease=false --latest

  notify-failure:
    needs: [prepare, build-and-test, create-tag, publish-npm, github-release, update-beta-ref, update-stable-ref]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Compose failure summary
        id: summary
        env:
          PREPARE: ${{ needs.prepare.result }}
          BUILD: ${{ needs.build-and-test.result }}
          TAG: ${{ needs.create-tag.result }}
          PUBLISH: ${{ needs.publish-npm.result }}
          RELEASE: ${{ needs.github-release.result }}
          BETA_REF: ${{ needs.update-beta-ref.result }}
          STABLE_REF: ${{ needs.update-stable-ref.result }}
        run: |
          FAILED_STAGES=""
          for stage in "prepare:$PREPARE" "build-and-test:$BUILD" "create-tag:$TAG" "publish-npm:$PUBLISH" "github-release:$RELEASE" "update-beta-ref:$BETA_REF" "update-stable-ref:$STABLE_REF"; do
            name="${stage%%:*}"
            result="${stage#*:}"
            if [ "$result" = "failure" ]; then
              FAILED_STAGES="${FAILED_STAGES:+$FAILED_STAGES, }$name"
            fi
          done
          if [ -z "$FAILED_STAGES" ]; then
            FAILED_STAGES="unknown"
          fi
          echo "stages=$FAILED_STAGES" >> $GITHUB_OUTPUT

      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          FAILED_STAGES: ${{ steps.summary.outputs.stages }}
        run: |
          KIND=$([ "$PRERELEASE" = "true" ] && echo "beta" || echo "stable")
          {
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Failed stages: \`$FAILED_STAGES\`"
            echo ""
            echo "If \`publish-npm\` succeeded but a later stage failed, the npm artifact is already live — re-running the workflow is safe (later stages are idempotent). If \`publish-npm\` itself failed, check for partial state on npm before retrying."
          } > /tmp/issue-body.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release v$VERSION ($KIND) failed at: $FAILED_STAGES" \
            --body-file /tmp/issue-body.md \
            --label "bug"

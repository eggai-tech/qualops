name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0 or 0.2.0-rc.1)'
        required: true
        type: string

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20.x
          cache: npm

      - name: Validate version format
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # Allow only the prerelease labels the downstream publish workflow
          # recognises (rc|alpha|beta). Anything else would be silently
          # classified as stable and published to npm's `latest` dist-tag.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|alpha|beta)\.[0-9]+)?$'; then
            echo "Error: Invalid version format '$VERSION'"
            echo "Allowed formats: X.Y.Z, X.Y.Z-rc.N, X.Y.Z-alpha.N, X.Y.Z-beta.N"
            echo "Examples: 0.3.0, 0.3.0-beta.1, 0.3.0-rc.2"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check for pre-release
        run: |
          if echo "$VERSION" | grep -qE '\-(rc|alpha|beta)\.[0-9]+$'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "Detected pre-release version"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "Detected stable release version"
          fi

      - name: Validate changelog has unreleased changes
        if: env.IS_PRERELEASE == 'false'
        run: |
          UNRELEASED_CONTENT=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | tail -n +2 | head -n -1)
          if [ -z "$(echo "$UNRELEASED_CONTENT" | grep -E '^### ')" ]; then
            echo "Error: No changes found in [Unreleased] section of CHANGELOG.md"
            echo "Please add changelog entries before creating a release."
            exit 1
          fi
          echo "Found changelog entries in [Unreleased] section"

      - name: Create release branch
        run: |
          git config user.name "eggai-release-bot[bot]"
          git config user.email "eggai-release-bot[bot]@users.noreply.github.com"
          git checkout -b release/v$VERSION
          echo "Created branch release/v$VERSION"

      - name: Update package.json version
        run: |
          npm version $VERSION --no-git-tag-version
          npm install --package-lock-only
          echo "Updated package.json and package-lock.json to version $VERSION"

      # Beta releases intentionally leave [Unreleased] untouched — the same
      # entries are promoted to a versioned section only at the stable cut.
      # See docs/tdr/0001-release-process.md for the rationale.
      - name: Update changelog for stable release
        if: env.IS_PRERELEASE == 'false'
        run: |
          DATE=$(date +%Y-%m-%d)
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] - $DATE/" CHANGELOG.md
          echo "Updated CHANGELOG.md with version $VERSION and date $DATE"

      - name: Extract changelog content
        id: changelog
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "CHANGELOG_CONTENT=Pre-release version $VERSION" >> $GITHUB_OUTPUT
          else
            CONTENT=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | tail -n +2 | head -n -1)
            DELIMITER=$(openssl rand -hex 8)
            echo "CHANGELOG_CONTENT<<${DELIMITER}" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "${DELIMITER}" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git push origin release/v$VERSION
          echo "BRANCH_PUSHED_THIS_RUN=true" >> $GITHUB_ENV

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}
        run: |
          printf '%s\n' "## Release v$VERSION" "" "$CHANGELOG_BODY" "" "---" "**Checklist:**" "- [ ] Version bump looks correct" "- [ ] Changelog entries are accurate" "- [ ] CI passes" "" "After merging, the release will be automatically tagged and published to npm." > /tmp/pr-body.md
          gh pr create \
            --title "chore: release v$VERSION" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head release/v$VERSION \
            --label release

      # If a prior step fails AFTER this run pushed the release branch,
      # delete it so the next attempt starts clean. We gate on the sentinel
      # set in the "Commit and push" step so we never delete a branch this
      # run didn't create — e.g., a leftover from a previous run that the
      # operator may still be inspecting.
      - name: Cleanup release branch on failure
        if: failure() && env.BRANCH_PUSHED_THIS_RUN == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="release/v$VERSION"
          echo "Deleting branch $BRANCH pushed by this run"
          git push origin --delete "$BRANCH" || echo "::warning::Failed to delete $BRANCH; remove manually."

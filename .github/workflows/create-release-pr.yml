name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0 or 0.2.0-rc.1)'
        required: true
        type: string

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z]+\.[0-9]+)?$'; then
            echo "Error: Invalid version format '$VERSION'"
            echo "Expected format: X.Y.Z or X.Y.Z-rc.N (e.g., 0.2.0 or 0.2.0-rc.1)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check for pre-release
        run: |
          if echo "$VERSION" | grep -qE '\-(rc|alpha|beta)\.[0-9]+$'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "Detected pre-release version"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "Detected stable release version"
          fi

      - name: Validate changelog has unreleased changes
        if: env.IS_PRERELEASE == 'false'
        run: |
          UNRELEASED_CONTENT=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | tail -n +2 | head -n -1)
          if [ -z "$(echo "$UNRELEASED_CONTENT" | grep -E '^### ')" ]; then
            echo "Error: No changes found in [Unreleased] section of CHANGELOG.md"
            echo "Please add changelog entries before creating a release."
            exit 1
          fi
          echo "Found changelog entries in [Unreleased] section"

      - name: Create release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b release/v$VERSION
          echo "Created branch release/v$VERSION"

      - name: Update package.json version
        run: |
          npm version $VERSION --no-git-tag-version
          echo "Updated package.json to version $VERSION"

      - name: Update changelog for stable release
        if: env.IS_PRERELEASE == 'false'
        run: |
          DATE=$(date +%Y-%m-%d)
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] - $DATE/" CHANGELOG.md
          echo "Updated CHANGELOG.md with version $VERSION and date $DATE"

      - name: Extract changelog content
        id: changelog
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "CHANGELOG_CONTENT=Pre-release version $VERSION" >> $GITHUB_OUTPUT
          else
            CONTENT=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | tail -n +2 | head -n -1)
            echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git push origin release/v$VERSION

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}
        run: |
          printf '%s\n' "## Release v$VERSION" "" "$CHANGELOG_BODY" "" "---" "**Checklist:**" "- [ ] Version bump looks correct" "- [ ] Changelog entries are accurate" "- [ ] CI passes" "" "After merging, a git tag will be automatically created and npm publish will be triggered." > /tmp/pr-body.md
          gh pr create \
            --title "chore: release v$VERSION" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head release/v$VERSION \
            --label release

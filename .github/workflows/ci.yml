name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      # Same rulesets and scope as the pre-commit hook (.git/hooks/pre-commit),
      # so local and CI agree. --error fails the job on any finding; verified
      # false positives are suppressed with inline `nosemgrep`.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --quiet \
            src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build check
        run: npm run build:check

      - name: Run tests
        run: npm test

  changelog:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check if changelog is required
        id: needs-changelog
        run: |
          # Changelog is required if the PR touches source code or tests.
          # PRs that only touch .github/, docs/, examples/, or root config files
          # are auto-skipped — no label needed.
          git fetch origin main
          CHANGED=$(git diff origin/main --name-only)
          CODE_CHANGED=$(echo "$CHANGED" | grep -E "^(src/|tests/|package\.json)" | grep -v "^CHANGELOG.md" || true)

          if [ -z "$CODE_CHANGED" ]; then
            echo "required=false" >> $GITHUB_OUTPUT
            echo "No code changes — changelog not required."
          else
            echo "required=true" >> $GITHUB_OUTPUT
            echo "Code changed — changelog required:"
            echo "$CODE_CHANGED"
          fi

      - name: Check changelog updated
        if: steps.needs-changelog.outputs.required == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Check if this is a release PR
          if echo "$HEAD_REF" | grep -qE '^release/v'; then
            VERSION=$(echo "$HEAD_REF" | sed 's/release\/v//')
            # Prerelease PRs intentionally leave [Unreleased] untouched —
            # entries are only promoted to a versioned section at the stable
            # cut. So for prerelease branches, only require that [Unreleased]
            # itself has content.
            if echo "$VERSION" | grep -qE '\-(rc|alpha|beta)\.[0-9]+$'; then
              echo "Prerelease release PR ($VERSION) detected — checking [Unreleased] has content..."
              UNRELEASED=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | tail -n +2 | head -n -1)
              if ! echo "$UNRELEASED" | grep -qE "^### " || ! echo "$UNRELEASED" | grep -qE "^- "; then
                echo "::error::Prerelease release PR must have entries under [Unreleased] in CHANGELOG.md"
                exit 1
              fi
              echo "Found [Unreleased] entries"
              exit 0
            fi
            echo "Stable release PR detected, checking for version entry..."
            if grep -qE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
              echo "Found version entry for $VERSION"
              exit 0
            else
              echo "Error: Release PR must have version entry in CHANGELOG.md"
              echo "Expected: ## [$VERSION] - YYYY-MM-DD"
              exit 1
            fi
          fi

          # For regular PRs, check if [Unreleased] section has content
          CHANGELOG_DIFF=$(git diff origin/main...HEAD -- CHANGELOG.md)
          if [ -z "$CHANGELOG_DIFF" ]; then
            echo "::error::CHANGELOG.md must be updated. Add your changes under [Unreleased] section."
            exit 1
          fi

          # Require at least one bullet entry under [Unreleased]
          UNRELEASED=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | tail -n +2 | head -n -1)
          if ! echo "$UNRELEASED" | grep -qE "^### "; then
            echo "::error::Add a category header (### Added, ### Fixed, etc.) under [Unreleased] in CHANGELOG.md"
            exit 1
          fi
          if ! echo "$UNRELEASED" | grep -qE "^- "; then
            echo "::error::Add at least one entry (- description) under [Unreleased] in CHANGELOG.md"
            exit 1
          fi
          echo "Changelog check passed!"

  qualops:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    concurrency:
      group: 'qualops-analysis'
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build QualOps
        run: npm run build

      - name: Run QualOps Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLAUDE_CODE_EXECUTABLE: ${{ github.workspace }}/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude
          QUALOPS_LANGFUSE_PUBLIC_KEY: ${{ secrets.QUALOPS_LANGFUSE_PUBLIC_KEY }}
          QUALOPS_LANGFUSE_SECRET_KEY: ${{ secrets.QUALOPS_LANGFUSE_SECRET_KEY }}
          QUALOPS_LANGFUSE_BASE_URL: ${{ vars.QUALOPS_LANGFUSE_BASE_URL }}
        run: |
          node dist/cli.js all \
            --base "origin/$BASE_REF" \
            --head "$HEAD_SHA" \
            --stages analyze,review,report

      - name: Post GitHub Integration
        if: always()
        working-directory: .qualops
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node ../dist/github/run-integration.js

      - name: Upload QualOps Reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: qualops-reports
          path: .qualops/reports/

  all-checks-passed:
    if: always()
    needs: [lint, semgrep, test, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CHANGELOG_RESULT: ${{ needs.changelog.result }}
        run: |
          if [ "$LINT_RESULT" != "success" ]; then
            echo "Lint job failed"
            exit 1
          fi
          if [ "$SEMGREP_RESULT" != "success" ]; then
            echo "Semgrep job failed"
            exit 1
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Test job failed"
            exit 1
          fi
          # Changelog is optional (skipped on push to main or when no code changes)
          if [ "$CHANGELOG_RESULT" != "success" ] && [ "$CHANGELOG_RESULT" != "skipped" ]; then
            echo "Changelog job failed"
            exit 1
          fi
          echo "All required checks passed!"

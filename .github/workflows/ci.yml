name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build check
        run: npm run build:check

      - name: Run tests
        run: npm test

  changelog:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check if changelog is required
        id: needs-changelog
        run: |
          # Changelog is required if the PR touches source code or tests.
          # PRs that only touch .github/, docs/, examples/, or root config files
          # are auto-skipped — no label needed.
          git fetch origin main
          CHANGED=$(git diff origin/main --name-only)
          CODE_CHANGED=$(echo "$CHANGED" | grep -E "^(src/|tests/|package\.json)" | grep -v "^CHANGELOG.md" || true)

          if [ -z "$CODE_CHANGED" ]; then
            echo "required=false" >> $GITHUB_OUTPUT
            echo "No code changes — changelog not required."
          else
            echo "required=true" >> $GITHUB_OUTPUT
            echo "Code changed — changelog required:"
            echo "$CODE_CHANGED"
          fi

      - name: Check changelog updated
        if: steps.needs-changelog.outputs.required == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Check if this is a release PR
          if echo "$HEAD_REF" | grep -qE '^release/v'; then
            echo "Release PR detected, checking for version entry..."
            VERSION=$(echo "$HEAD_REF" | sed 's/release\/v//')
            if grep -qE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
              echo "Found version entry for $VERSION"
              exit 0
            else
              echo "Error: Release PR must have version entry in CHANGELOG.md"
              echo "Expected: ## [$VERSION] - YYYY-MM-DD"
              exit 1
            fi
          fi

          # For regular PRs, check if [Unreleased] section has content
          CHANGELOG_DIFF=$(git diff origin/main...HEAD -- CHANGELOG.md)
          if [ -z "$CHANGELOG_DIFF" ]; then
            echo "::error::CHANGELOG.md must be updated. Add your changes under [Unreleased] section."
            exit 1
          fi

          # Require at least one bullet entry under [Unreleased]
          UNRELEASED=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | tail -n +2 | head -n -1)
          if ! echo "$UNRELEASED" | grep -qE "^### "; then
            echo "::error::Add a category header (### Added, ### Fixed, etc.) under [Unreleased] in CHANGELOG.md"
            exit 1
          fi
          if ! echo "$UNRELEASED" | grep -qE "^- "; then
            echo "::error::Add at least one entry (- description) under [Unreleased] in CHANGELOG.md"
            exit 1
          fi
          echo "Changelog check passed!"

  qualops:
    # if: false # Disabled for now
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build QualOps
        run: npm run build

      - name: Run QualOps Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node dist/cli.js all \
            --base "origin/$BASE_REF" \
            --head "$HEAD_SHA" \
            --stages analyze,review,report

      - name: Post GitHub Integration
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/github/run-integration.js

      - name: Upload QualOps Reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: qualops-reports
          path: reports/

  all-checks-passed:
    if: always()
    needs: [lint, test, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CHANGELOG_RESULT: ${{ needs.changelog.result }}
        run: |
          if [ "$LINT_RESULT" != "success" ]; then
            echo "Lint job failed"
            exit 1
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Test job failed"
            exit 1
          fi
          # Changelog is optional (skipped on push to main or when no code changes)
          if [ "$CHANGELOG_RESULT" != "success" ] && [ "$CHANGELOG_RESULT" != "skipped" ]; then
            echo "Changelog job failed"
            exit 1
          fi
          echo "All required checks passed!"

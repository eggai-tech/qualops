description: "QualOps Code Review Evaluation"

providers:
  # File-by-file: single LLM call per file, no validation/dedup
  - id: file://qualops-provider.js
    label: qualops-sonnet-file
    config:
      model: claude-sonnet-4-20250514
      provider: anthropic
      mode: file-by-file

  # Agentic: multi-turn agent with tools (Anthropic only)
  - id: file://qualops-provider.js
    label: qualops-sonnet-agentic
    config:
      model: claude-sonnet-4-20250514
      provider: anthropic
      mode: agentic

  # Uncomment for additional configs:
  # - id: file://qualops-provider.js
  #   label: qualops-haiku-file
  #   config:
  #     model: claude-haiku-4-5-20251001
  #     provider: anthropic
  #     mode: file-by-file
  # - id: file://qualops-provider.js
  #   label: qualops-sonnet-pipeline
  #   config:
  #     model: claude-sonnet-4-20250514
  #     provider: anthropic
  #     mode: pipeline

prompts:
  - file://prompt-loader.js

tests: file://datasets/tests.json

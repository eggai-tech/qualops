<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
<defs>
<linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#5b9eff" stop-opacity="0.18"/>
<stop offset="1" stop-color="#5b9eff" stop-opacity="0.05"/>
</linearGradient>
<linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#7ee787" stop-opacity="0.18"/>
<stop offset="1" stop-color="#7ee787" stop-opacity="0.05"/>
</linearGradient>
<linearGradient id="g3" x1="0" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#ffb454" stop-opacity="0.18"/>
<stop offset="1" stop-color="#ffb454" stop-opacity="0.05"/>
</linearGradient>
</defs>

<rect width="900" height="460" fill="#0e1116"/>

<text x="450" y="40" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">The three layers of agent evaluation</text>
<text x="450" y="62" text-anchor="middle" fill="#9aa6b2" font-size="13">Component → trajectory → outcome. Reporting only the outcome hides the bug you actually care about.</text>

<!-- Layer 1: Component -->
<rect x="40" y="100" width="260" height="320" rx="10" fill="url(#g1)" stroke="#5b9eff" stroke-width="2"/>
<rect x="40" y="100" width="260" height="40" rx="10" fill="#5b9eff" fill-opacity="0.25"/>
<text x="170" y="126" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Component-level</text>

<text x="60" y="170" fill="#e6edf3" font-size="13" font-weight="600">Question</text>
<text x="60" y="192" fill="#9aa6b2" font-size="12.5">Does each sub-skill</text>
<text x="60" y="208" fill="#9aa6b2" font-size="12.5">work in isolation?</text>

<text x="60" y="240" fill="#e6edf3" font-size="13" font-weight="600">Examples</text>
<text x="60" y="262" fill="#9aa6b2" font-size="12.5">• Tool-match rate</text>
<text x="60" y="280" fill="#9aa6b2" font-size="12.5">• Parameter F1</text>
<text x="60" y="298" fill="#9aa6b2" font-size="12.5">• Retrieval recall@k</text>
<text x="60" y="316" fill="#9aa6b2" font-size="12.5">• Schema validation</text>

<text x="60" y="350" fill="#e6edf3" font-size="13" font-weight="600">QualOps mapping</text>
<text x="60" y="372" fill="#9aa6b2" font-size="12.5">Did Analyze read_file</text>
<text x="60" y="388" fill="#9aa6b2" font-size="12.5">with right path? Did the</text>
<text x="60" y="404" fill="#9aa6b2" font-size="12.5">finding match schema?</text>

<!-- Layer 2: Trajectory -->
<rect x="320" y="100" width="260" height="320" rx="10" fill="url(#g2)" stroke="#7ee787" stroke-width="2"/>
<rect x="320" y="100" width="260" height="40" rx="10" fill="#7ee787" fill-opacity="0.25"/>
<text x="450" y="126" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Trajectory-level</text>

<text x="340" y="170" fill="#e6edf3" font-size="13" font-weight="600">Question</text>
<text x="340" y="192" fill="#9aa6b2" font-size="12.5">Is the path of reasoning</text>
<text x="340" y="208" fill="#9aa6b2" font-size="12.5">+ actions valid, efficient,</text>
<text x="340" y="224" fill="#9aa6b2" font-size="12.5">and faithful?</text>

<text x="340" y="256" fill="#e6edf3" font-size="13" font-weight="600">Examples</text>
<text x="340" y="278" fill="#9aa6b2" font-size="12.5">• Plan correctness</text>
<text x="340" y="296" fill="#9aa6b2" font-size="12.5">• Trajectory edit distance</text>
<text x="340" y="314" fill="#9aa6b2" font-size="12.5">• Tool-call F1 over seq.</text>
<text x="340" y="332" fill="#9aa6b2" font-size="12.5">• Step-level grounding</text>

<text x="340" y="362" fill="#e6edf3" font-size="13" font-weight="600">QualOps mapping</text>
<text x="340" y="384" fill="#9aa6b2" font-size="12.5">Did Review's parallel</text>
<text x="340" y="400" fill="#9aa6b2" font-size="12.5">sub-agents converge</text>
<text x="340" y="416" fill="#9aa6b2" font-size="12.5">without redundant calls?</text>

<!-- Layer 3: Outcome -->
<rect x="600" y="100" width="260" height="320" rx="10" fill="url(#g3)" stroke="#ffb454" stroke-width="2"/>
<rect x="600" y="100" width="260" height="40" rx="10" fill="#ffb454" fill-opacity="0.25"/>
<text x="730" y="126" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Outcome-level</text>

<text x="620" y="170" fill="#e6edf3" font-size="13" font-weight="600">Question</text>
<text x="620" y="192" fill="#9aa6b2" font-size="12.5">Did the agent achieve</text>
<text x="620" y="208" fill="#9aa6b2" font-size="12.5">the user goal?</text>

<text x="620" y="240" fill="#e6edf3" font-size="13" font-weight="600">Examples</text>
<text x="620" y="262" fill="#9aa6b2" font-size="12.5">• Task success</text>
<text x="620" y="280" fill="#9aa6b2" font-size="12.5">• Unit-test pass rate</text>
<text x="620" y="298" fill="#9aa6b2" font-size="12.5">  (SWE-bench style)</text>
<text x="620" y="316" fill="#9aa6b2" font-size="12.5">• Human rating</text>

<text x="620" y="350" fill="#e6edf3" font-size="13" font-weight="600">QualOps mapping</text>
<text x="620" y="372" fill="#9aa6b2" font-size="12.5">Did the suggested fix</text>
<text x="620" y="388" fill="#9aa6b2" font-size="12.5">actually fix the bug?</text>
<text x="620" y="404" fill="#9aa6b2" font-size="12.5">Did the Report match?</text>

</svg>

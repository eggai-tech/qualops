<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
<rect width="1000" height="540" fill="#0e1116"/>

<text x="500" y="36" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Two-tier eval cadence</text>
<text x="500" y="58" text-anchor="middle" fill="#9aa6b2" font-size="13">Fast feedback per PR, deeper truth per night, capability assurance per week.</text>

<!-- Tier 1 -->
<rect x="40" y="100" width="920" height="120" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.5" stroke-opacity="0.6"/>
<text x="60" y="124" fill="#7ee787" font-size="14" font-weight="700">PER-PR · 3–5 min · BLOCKING</text>
<text x="60" y="142" fill="#9aa6b2" font-size="12">Promptfoo YAML asserts on each pipeline stage. PR-comment diff vs main. Gate the merge.</text>

<g font-size="12">
<rect x="60" y="158" width="160" height="48" rx="6" fill="#1c232c" stroke="#7ee787"/>
<text x="140" y="178" text-anchor="middle" fill="#e6edf3">Promptfoo asserts</text>
<text x="140" y="195" text-anchor="middle" fill="#9aa6b2" font-size="11">~30 per-stage</text>

<rect x="240" y="158" width="160" height="48" rx="6" fill="#1c232c" stroke="#7ee787"/>
<text x="320" y="178" text-anchor="middle" fill="#e6edf3">Tool-call F1</text>
<text x="320" y="195" text-anchor="middle" fill="#9aa6b2" font-size="11">spot regressions early</text>

<rect x="420" y="158" width="160" height="48" rx="6" fill="#1c232c" stroke="#7ee787"/>
<text x="500" y="178" text-anchor="middle" fill="#e6edf3">Schema + guardrails</text>
<text x="500" y="195" text-anchor="middle" fill="#9aa6b2" font-size="11">deterministic</text>

<rect x="600" y="158" width="160" height="48" rx="6" fill="#1c232c" stroke="#7ee787"/>
<text x="680" y="178" text-anchor="middle" fill="#e6edf3">PR-comment diff</text>
<text x="680" y="195" text-anchor="middle" fill="#9aa6b2" font-size="11">vs main baseline</text>

<rect x="780" y="158" width="160" height="48" rx="6" fill="#1c232c" stroke="#ff7b72"/>
<text x="860" y="178" text-anchor="middle" fill="#e6edf3">Block on regression</text>
<text x="860" y="195" text-anchor="middle" fill="#9aa6b2" font-size="11">required check</text>
</g>

<!-- Tier 2 -->
<rect x="40" y="240" width="920" height="120" rx="10" fill="#161b22" stroke="#5b9eff" stroke-width="1.5" stroke-opacity="0.6"/>
<text x="60" y="264" fill="#5b9eff" font-size="14" font-weight="700">NIGHTLY · 30–60 min · NON-BLOCKING + ALERTS</text>
<text x="60" y="282" fill="#9aa6b2" font-size="12">Langfuse experiment, full pipeline, LLM-as-judge scorers, paired stat comparison vs previous baseline.</text>

<g font-size="12">
<rect x="60" y="298" width="160" height="48" rx="6" fill="#1c232c" stroke="#5b9eff"/>
<text x="140" y="318" text-anchor="middle" fill="#e6edf3">100–200 dataset items</text>
<text x="140" y="335" text-anchor="middle" fill="#9aa6b2" font-size="11">CRB + internal PRs</text>

<rect x="240" y="298" width="160" height="48" rx="6" fill="#1c232c" stroke="#5b9eff"/>
<text x="320" y="318" text-anchor="middle" fill="#e6edf3">LLM-as-judge per stage</text>
<text x="320" y="335" text-anchor="middle" fill="#9aa6b2" font-size="11">cross-model</text>

<rect x="420" y="298" width="160" height="48" rx="6" fill="#1c232c" stroke="#5b9eff"/>
<text x="500" y="318" text-anchor="middle" fill="#e6edf3">Agent-as-judge</text>
<text x="500" y="335" text-anchor="middle" fill="#9aa6b2" font-size="11">on final Report</text>

<rect x="600" y="298" width="160" height="48" rx="6" fill="#1c232c" stroke="#5b9eff"/>
<text x="680" y="318" text-anchor="middle" fill="#e6edf3">pass^5 reliability</text>
<text x="680" y="335" text-anchor="middle" fill="#9aa6b2" font-size="11">5 runs / task</text>

<rect x="780" y="298" width="160" height="48" rx="6" fill="#1c232c" stroke="#5b9eff"/>
<text x="860" y="318" text-anchor="middle" fill="#e6edf3">Slack + dashboard</text>
<text x="860" y="335" text-anchor="middle" fill="#9aa6b2" font-size="11">drift alerts</text>
</g>

<!-- Tier 3 -->
<rect x="40" y="380" width="920" height="120" rx="10" fill="#161b22" stroke="#ffb454" stroke-width="1.5" stroke-opacity="0.6"/>
<text x="60" y="404" fill="#ffb454" font-size="14" font-weight="700">WEEKLY · ~2 hours · CAPABILITY EVAL</text>
<text x="60" y="422" fill="#9aa6b2" font-size="12">Inspect AI on held-out fixture repos. SWE-bench-style harness on Fix stage. Drift report.</text>

<g font-size="12">
<rect x="60" y="438" width="160" height="48" rx="6" fill="#1c232c" stroke="#ffb454"/>
<text x="140" y="458" text-anchor="middle" fill="#e6edf3">Inspect AI bridge</text>
<text x="140" y="475" text-anchor="middle" fill="#9aa6b2" font-size="11">unmodified harness</text>

<rect x="240" y="438" width="160" height="48" rx="6" fill="#1c232c" stroke="#ffb454"/>
<text x="320" y="458" text-anchor="middle" fill="#e6edf3">Held-out repos</text>
<text x="320" y="475" text-anchor="middle" fill="#9aa6b2" font-size="11">contamination-free</text>

<rect x="420" y="438" width="160" height="48" rx="6" fill="#1c232c" stroke="#ffb454"/>
<text x="500" y="458" text-anchor="middle" fill="#e6edf3">SWE-bench-style</text>
<text x="500" y="475" text-anchor="middle" fill="#9aa6b2" font-size="11">FAIL_TO_PASS + PASS_TO_PASS</text>

<rect x="600" y="438" width="160" height="48" rx="6" fill="#1c232c" stroke="#ffb454"/>
<text x="680" y="458" text-anchor="middle" fill="#e6edf3">SWE-bench Live mining</text>
<text x="680" y="475" text-anchor="middle" fill="#9aa6b2" font-size="11">50/month fresh</text>

<rect x="780" y="438" width="160" height="48" rx="6" fill="#1c232c" stroke="#ffb454"/>
<text x="860" y="458" text-anchor="middle" fill="#e6edf3">Drift report</text>
<text x="860" y="475" text-anchor="middle" fill="#9aa6b2" font-size="11">to leadership</text>
</g>

<text x="500" y="525" text-anchor="middle" fill="#9aa6b2" font-size="11" font-style="italic">Engineers get fast feedback. The team gets deeper nightly truth. Leadership gets weekly capability assurance.</text>

</svg>
